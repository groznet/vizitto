<header x-data="{ mobileMenuOpen: false }" class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <div class="flex items-center">
                <a href="/" class="flex items-center space-x-2">
                    <div class="bg-primary w-10 h-10 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-xl">V</span>
                    </div>
                    <span class="text-xl font-bold text-primary">Vizitto</span>
                </a>
            </div>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="text-primary font-medium">Главная</a>
                <a href="cards.html" class="hover:text-primary transition">Каталог</a>
                <a href="faq.html" class="hover:text-primary transition">Вопросы ответы</a>
                <a href="about.html" class="hover:text-primary transition">О нас</a>
                <a href="contact.html" class="hover:text-primary transition">Контакты</a>
            </nav>

            <div class="flex items-center space-x-4">
                <a href="/dashboard" class="hidden md:inline-block bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition">Войти</a>
                <a href="/dashboard" class="bg-primary hover:bg-blue-800 text-white px-4 py-2 rounded-lg transition">Регистрация</a>
                
                <!-- Mobile menu button -->
                <button
                    @click="mobileMenuOpen = !mobileMenuOpen"
                    class="md:hidden text-gray-600"
                    aria-label="Toggle menu"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Mobile Navigation -->
    <nav
        x-show="mobileMenuOpen"
        x-transition
        class="md:hidden bg-white py-4 px-4 border-t"
        @click.outside="mobileMenuOpen = false"
    >
        <div class="flex flex-col space-y-3">
            <a href="/" class="text-primary font-medium py-2">Главная</a>
            <a href="/cards.html" class="py-2">Каталог</a>
            <a href="/blog.html" class="py-2">Новости</a>
            <a href="/faq.html" class="py-2">Вопросы ответы</a>
            <a href="/about.html" class="py-2">О нас</a>
            <a href="/contact.html" class="py-2">Контакты</a>
        </div>
    </nav>
</header>
